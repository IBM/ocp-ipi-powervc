- hosts:
    all

  vars:

  tasks:

    - name: Check if username is empty
      ansible.builtin.fail:
        msg: "The variable 'username' is empty or not defined. Please provide a value."
      when: username | default('') | length == 0

    - name: Check if password is empty
      ansible.builtin.fail:
        msg: "The variable 'password' is empty or not defined. Please provide a value."
      when: password | default('') | length == 0

    - name: Check if ip is empty
      ansible.builtin.fail:
        msg: "The variable 'ip' is empty or not defined. Please provide a value."
      when: ip | default('') | length == 0

    - name: Check if project_id is empty
      ansible.builtin.fail:
        msg: "The variable 'project_id' is empty or not defined. Please provide a value."
      when: project_id | default('') | length == 0

    - name: Check if project_name is empty
      ansible.builtin.fail:
        msg: "The variable 'project_name' is empty or not defined. Please provide a value."
      when: project_name | default('') | length == 0

    - name: Gather all facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "interfaces"

    - name: Show facts
      debug:
        msg:
          - "{{ ansible_facts['interfaces'] }}"

    - name: Get list of non-loopback interfaces
      ansible.builtin.set_fact:
        ethernet_interfaces: >-
          {{ ansible_facts['interfaces'] | reject('equalto', 'lo') | list }}
      run_once: true

    - name: Show facts
      debug:
        msg:
          - "{{ ethernet_interfaces }}"
          - "{{ ethernet_interfaces[0] }}"

    - name: Install packages
      yum:
        name: "{{ packages }}"
      vars:
        packages:
          - kea
          - git
          - make
          - patch
          - podman
          - tmux
          - zip
          - dnf-plugins-core
      become: yes

    - name: Create /etc/kea/kea-dhcp4.conf
      ansible.builtin.copy:
        dest: /etc/kea/kea-dhcp4.conf
        content: |
          {
            "Dhcp4": {
              "interfaces-config": {
                "interfaces": [ "{{ ethernet_interfaces[0] }}" ]
              },
              "lease-database": {
                "type": "memfile",
                "persist": true,
                "name": "/var/lib/kea/kea-leases4.csv"
              },
              "valid-lifetime": 2678400,
              "max-valid-lifetime": 2678400,
              "subnet4": [
                {
                  "id": 1,
                  "subnet": "10.130.32.0/20",
                  "interface": "{{ ethernet_interfaces[0] }}",
                  "pools": [],
                  "reservations": [
                    {
                      "hw-address": "00:11:22:33:44:55",
                      "ip-address": "10.130.32.10"
                    }
                  ]
                }
              ]
            }
          }
        mode: '0644'
        owner: root
        group: root
      become: yes

    - name: systemctl kea-dhcp4
      ansible.builtin.systemd:
        name: kea-dhcp4.service
        state: started
        enabled: true
      become: yes

    - name: configure CRB
      shell: |
        (
          sudo dnf config-manager --set-enabled crb
        ) 
      become: yes

    # CentOS Stream 10 has no centos-release-openstack-* or python3-openstackclient
    # RPMs, so install the client from PyPI for the cloud-user account instead.
    # gcc and python3-devel are needed because psutil and msgpack have no
    # ppc64le wheels and must be built from source.
    - name: Install pip and build dependencies
      yum:
        name:
          - python3-pip
          - python3-devel
          - gcc
      become: yes

    - name: Install python-openstackclient
      ansible.builtin.pip:
        name: python-openstackclient
        extra_args: --user

    - name: Git checkout ocp-ipi-powervc
      ansible.builtin.git:
        repo: 'https://github.com/IBM/ocp-ipi-powervc.git'
        dest: /home/cloud-user/ocp-ipi-powervc
        version: main

    - name: Get PowerVC-Tool status
      stat:
        path: /home/cloud-user/ocp-ipi-powervc/TODO
      register: pvct_stat

    - name: Install ocp-ipi-powervc
      shell: |
        (
          cd ~/ocp-ipi-powervc/
          TAG=$(git describe --abbrev=0 --tags)
          VERSION=$(git describe --always --long --dirty)
          ARCH=$(uname -m)
          if [ "${ARCH}" == "x86_64" ]; then ARCH="amd64"; fi
          curl --location --remote-name https://github.com/IBM/ocp-ipi-powervc/releases/download/${TAG}/ocp-ipi-powervc-linux-${ARCH}
          chmod u+x ocp-ipi-powervc-linux-${ARCH}
        ) 
      when: not pvct_stat.stat.exists

    - name: Git checkout installer
      ansible.builtin.git:
        repo: 'https://github.com/openshift/installer.git'
        dest: /home/cloud-user/installer
        version: main

    - name: Get Go directory
      stat:
        path: /usr/local/go/
      register: go_stat

    - name: Install Go
      shell: |
        (
          VERSION="1.27.4"
          if [ -d /usr/local/go/ ]
          then
            /bin/rm -rf /usr/local/go/
          fi
          curl --location --remote-name "https://go.dev/dl/go${VERSION}.linux-ppc64le.tar.gz"
          tar -C /usr/local -xzf "go${VERSION}.linux-ppc64le.tar.gz"
        ) 
      become: yes

    - name: Ensure /usr/local/go/bin is in PATH
      ansible.builtin.blockinfile:
        path: /home/cloud-user/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK: go PATH"
        block: |
          if ! [[ "$PATH" =~ "/usr/local/go/bin" ]]; then
              PATH="$PATH:/usr/local/go/bin"
          fi
        create: yes
        owner: cloud-user
        group: cloud-user
        mode: '0644'

    - name: Create a new directory
      ansible.builtin.file:
        path: /home/cloud-user/.config/openstack/
        state: directory
        owner: cloud-user
        group: cloud-user
        mode: '0755'
        recurse: yes

    - name: Create /home/cloud-user/.config/openstack/clouds.yaml
      no_log: true
      ansible.builtin.copy:
        dest: /home/cloud-user/.config/openstack/clouds.yaml
        content: |
          clouds:
            powervc:
              auth:
                auth_url: "https://{{ ip }}:5000"
                username: "{{ username }}"
                password: "{{ password }}"
                project_id: "{{ project_id }}"
                project_name: "{{ project_name }}"
                user_domain_name: "Default"
              cacert: /home/cloud-user/.config/openstack/ocp-ci-ca.pem
              interface: "public"
              identity_api_version: 3
        mode: '0644'
        owner: cloud-user
        group: cloud-user

    - name: Create ocp-ci-ca.pem
      shell: |
        (
          echo "" | openssl s_client -showcerts -prexit -connect "{{ ip }}:443" 2> /dev/null | sed -n -e '/BEGIN CERTIFICATE/,/END CERTIFICATE/ p' > /home/cloud-user/.config/openstack/ocp-ci-ca.pem
          chmod 0644 /home/cloud-user/.config/openstack/ocp-ci-ca.pem
          chown cloud-user:cloud-user /home/cloud-user/.config/openstack/ocp-ci-ca.pem
        )

    - name: Create bin directory
      ansible.builtin.file:
        path: /home/cloud-user/bin
        state: directory
        owner: cloud-user
        group: cloud-user
        mode: '0755'
        recurse: yes

    - name: Get oc status
      stat:
        path: /home/cloud-user/bin/oc
      register: oc_stat

    - name: Install oc
      shell: |
        (
          VERSION="4.22.9"
          cd ~/bin/
          /bin/rm oc kubectl
          curl --silent --location --remote-name https://mirror.openshift.com/pub/openshift-v4/ppc64le/clients/ocp/${VERSION}/openshift-client-linux-ppc64le-rhel9-${VERSION}.tar.gz
          tar xvf openshift-client-linux-ppc64le-rhel9-${VERSION}.tar.gz oc kubectl
        ) 
      when: not oc_stat.stat.exists
